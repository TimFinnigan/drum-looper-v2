<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Looper</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a1a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            margin-bottom: 40px;
            color: #888;
        }

        .controls {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            align-items: center;
        }

        button {
            background: #333;
            border: none;
            color: #fff;
            padding: 12px 24px;
            font-size: 0.875rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.2s;
            border-radius: 4px;
        }

        button:hover {
            background: #444;
        }

        button.active {
            background: #e74c3c;
        }

        .bpm-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bpm-control label {
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #888;
        }

        .bpm-input-wrapper {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .bpm-control input {
            width: 80px;
            background: #333;
            border: none;
            color: #fff;
            padding: 10px 14px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 4px;
            -moz-appearance: textfield;
        }

        .bpm-control input::-webkit-outer-spin-button,
        .bpm-control input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .bpm-arrows {
            display: none;
            flex-direction: column;
            gap: 2px;
        }

        .bpm-arrow {
            width: 20px;
            height: 18px;
            background: #333;
            border: none;
            color: #888;
            font-size: 10px;
            cursor: pointer;
            border-radius: 3px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.15s;
            line-height: 1;
            padding: 0;
        }

        .bpm-arrow:hover {
            background: #444;
            color: #fff;
        }

        .bpm-arrow:active {
            background: #555;
        }

        @media (min-width: 701px) {
            .bpm-arrows {
                display: flex;
            }
        }

        .bpm-control select {
            width: 80px;
            background: #333;
            border: none;
            color: #fff;
            padding: 10px 8px;
            font-size: 1.1rem;
            text-align: center;
            border-radius: 4px;
            -moz-appearance: textfield;
            cursor: pointer;
        }

        .settings-row {
            display: flex;
            gap: 20px;
            align-items: center;
            flex-wrap: wrap;
            justify-content: center;
        }

        .sequencer-wrapper {
            max-width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .sequencer {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .track {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .track-label {
            width: 80px;
            min-width: 80px;
            font-size: 0.75rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            color: #888;
            text-align: right;
            cursor: pointer;
            transition: color 0.2s;
            user-select: none;
            position: sticky;
            left: 0;
            background: #1a1a1a;
            z-index: 1;
            padding-right: 8px;
        }

        .track-label:hover {
            color: #fff;
        }

        .track.muted .track-label {
            color: #444;
            text-decoration: line-through;
        }

        .track.muted .step.active {
            opacity: 0.3;
        }

        .steps {
            display: flex;
            gap: 4px;
        }

        .track:first-child .steps {
            padding-top: 2px;
        }

        .track:last-child .steps {
            padding-bottom: 2px;
        }

        .step {
            width: 36px;
            height: 36px;
            background: #2a2a2a;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.15s;
        }

        .step:hover {
            background: #3a3a3a;
        }

        .step.active {
            background: var(--track-color, #3498db);
        }

        .step.playing {
            box-shadow: 0 0 0 2px #fff;
        }

        .track[data-track="kick"] .step.active { background: #e74c3c; }
        .track[data-track="snare"] .step.active { background: #f39c12; }
        .track[data-track="hihat"] .step.active { background: #3498db; }
        .track[data-track="openhat"] .step.active { background: #9b59b6; }
        .track[data-track="eightoh"] .step.active { background: #e91e63; }
        .track[data-track="clap"] .step.active { background: #00bcd4; }

        .download-section {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        #downloadBtn {
            background: #2ecc71;
        }

        #downloadBtn:hover {
            background: #27ae60;
        }

        @media (max-width: 700px) {
            body {
                padding: 20px 5px;
            }

            h1 {
                margin-bottom: 20px;
            }

            .controls {
                flex-wrap: wrap;
                justify-content: center;
                gap: 10px;
                margin-bottom: 20px;
            }

            button {
                padding: 10px 16px;
                font-size: 0.75rem;
            }

            .download-section {
                margin-top: 20px;
            }

            .bpm-control input,
            .bpm-control select {
                min-height: 44px;
                font-size: 1rem;
                padding: 10px 8px;
                width: 70px;
            }

            .settings-row {
                gap: 12px;
            }

            .sequencer {
                gap: 4px;
            }

            .track {
                gap: 6px;
            }

            .track-label {
                width: 55px;
                min-width: 55px;
                font-size: 0.7rem;
                padding-right: 4px;
            }
        }

        button, .step, .track-label {
            touch-action: manipulation;
        }

        input, select {
            touch-action: manipulation;
            -webkit-user-select: text;
            user-select: text;
        }
    </style>
</head>
<body>
    <h1>Drum Looper</h1>

    <div class="controls">
        <button id="playBtn">Play</button>
        <button id="clearBtn">Clear</button>
        <button id="randomBtn">Random</button>
    </div>

    <div class="sequencer-wrapper">
        <div class="sequencer">
            <div class="track" data-track="kick">
                <span class="track-label">Kick</span>
                <div class="steps"></div>
            </div>
            <div class="track" data-track="snare">
                <span class="track-label">Snare</span>
                <div class="steps"></div>
            </div>
            <div class="track" data-track="hihat">
                <span class="track-label">Hi-Hat</span>
                <div class="steps"></div>
            </div>
            <div class="track" data-track="openhat">
                <span class="track-label">Open Hat</span>
                <div class="steps"></div>
            </div>
            <div class="track" data-track="eightoh">
                <span class="track-label">808</span>
                <div class="steps"></div>
            </div>
            <div class="track" data-track="clap">
                <span class="track-label">Clap</span>
                <div class="steps"></div>
            </div>
        </div>
    </div>

    <div class="download-section">
        <div class="settings-row">
            <div class="bpm-control">
                <label for="bpm">BPM</label>
                <div class="bpm-input-wrapper">
                    <input type="number" id="bpm" value="120" min="60" max="200" step="1" inputmode="numeric">
                    <div class="bpm-arrows">
                        <button class="bpm-arrow" id="bpmUp" type="button">▲</button>
                        <button class="bpm-arrow" id="bpmDown" type="button">▼</button>
                    </div>
                </div>
            </div>
            <div class="bpm-control">
                <label for="steps">Steps</label>
                <select id="steps">
                    <option value="8">8</option>
                    <option value="16" selected>16</option>
                    <option value="24">24</option>
                </select>
            </div>
        </div>
        <button id="downloadBtn">Download WAV</button>
    </div>

    <script>
        let STEPS = 16;
        let audioContext = null;
        let isPlaying = false;
        let currentStep = 0;
        let intervalId = null;

        let pattern = {
            kick: new Array(STEPS).fill(false),
            snare: new Array(STEPS).fill(false),
            hihat: new Array(STEPS).fill(false),
            openhat: new Array(STEPS).fill(false),
            eightoh: new Array(STEPS).fill(false),
            clap: new Array(STEPS).fill(false)
        };

        const muted = {
            kick: false, snare: false, hihat: false, openhat: false,
            eightoh: false, clap: false
        };

        // Detect mobile device
        function isMobileDevice() {
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || 
                   window.innerWidth <= 768;
        }

        function initAudio() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
        }

        function playKick(time = 0) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.connect(gain);
            gain.connect(audioContext.destination);

            osc.frequency.setValueAtTime(150, audioContext.currentTime + time);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + 0.5);

            gain.gain.setValueAtTime(1, audioContext.currentTime + time);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + 0.5);

            osc.start(audioContext.currentTime + time);
            osc.stop(audioContext.currentTime + time + 0.5);
        }

        function playSnare(time = 0) {
            const noise = audioContext.createBufferSource();
            const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.2, audioContext.sampleRate);
            const output = noiseBuffer.getChannelData(0);

            for (let i = 0; i < noiseBuffer.length; i++) {
                output[i] = Math.random() * 2 - 1;
            }

            noise.buffer = noiseBuffer;

            const noiseFilter = audioContext.createBiquadFilter();
            noiseFilter.type = 'highpass';
            noiseFilter.frequency.value = 1000;

            const noiseGain = audioContext.createGain();
            noiseGain.gain.setValueAtTime(1, audioContext.currentTime + time);
            noiseGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + 0.2);

            noise.connect(noiseFilter);
            noiseFilter.connect(noiseGain);
            noiseGain.connect(audioContext.destination);

            const osc = audioContext.createOscillator();
            const oscGain = audioContext.createGain();

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(100, audioContext.currentTime + time);
            osc.frequency.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + 0.1);

            oscGain.gain.setValueAtTime(0.7, audioContext.currentTime + time);
            oscGain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + 0.1);

            osc.connect(oscGain);
            oscGain.connect(audioContext.destination);

            noise.start(audioContext.currentTime + time);
            osc.start(audioContext.currentTime + time);
            osc.stop(audioContext.currentTime + time + 0.2);
        }

        function playHiHat(time = 0, open = false) {
            const fundamental = 40;
            const ratios = [2, 3, 4.16, 5.43, 6.79, 8.21];

            const gain = audioContext.createGain();
            gain.connect(audioContext.destination);

            const duration = open ? 0.3 : 0.08;

            gain.gain.setValueAtTime(0.3, audioContext.currentTime + time);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + duration);

            const bandpass = audioContext.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.value = 10000;
            bandpass.connect(gain);

            const highpass = audioContext.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.value = 7000;
            highpass.connect(bandpass);

            ratios.forEach(ratio => {
                const osc = audioContext.createOscillator();
                osc.type = 'square';
                osc.frequency.value = fundamental * ratio;
                osc.connect(highpass);
                osc.start(audioContext.currentTime + time);
                osc.stop(audioContext.currentTime + time + duration);
            });
        }

        function play808(time = 0) {
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();

            osc.type = 'sine';
            osc.connect(gain);
            gain.connect(audioContext.destination);

            // 808 has a longer decay and lower frequency
            osc.frequency.setValueAtTime(55, audioContext.currentTime + time);
            osc.frequency.exponentialRampToValueAtTime(30, audioContext.currentTime + time + 0.15);

            gain.gain.setValueAtTime(1.2, audioContext.currentTime + time);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + time + 0.8);

            osc.start(audioContext.currentTime + time);
            osc.stop(audioContext.currentTime + time + 0.8);
        }

        function playClap(time = 0) {
            // Clap is multiple noise bursts layered
            const burstCount = 4;
            const burstSpacing = 0.01;

            for (let i = 0; i < burstCount; i++) {
                const noise = audioContext.createBufferSource();
                const noiseBuffer = audioContext.createBuffer(1, audioContext.sampleRate * 0.15, audioContext.sampleRate);
                const output = noiseBuffer.getChannelData(0);

                for (let j = 0; j < noiseBuffer.length; j++) {
                    output[j] = Math.random() * 2 - 1;
                }

                noise.buffer = noiseBuffer;

                const filter = audioContext.createBiquadFilter();
                filter.type = 'bandpass';
                filter.frequency.value = 1200;
                filter.Q.value = 0.5;

                const gain = audioContext.createGain();
                const startTime = audioContext.currentTime + time + (i * burstSpacing);

                gain.gain.setValueAtTime(0.8, startTime);
                gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioContext.destination);

                noise.start(startTime);
            }
        }

        function playSound(track, time = 0) {
            switch(track) {
                case 'kick': playKick(time); break;
                case 'snare': playSnare(time); break;
                case 'hihat': playHiHat(time, false); break;
                case 'openhat': playHiHat(time, true); break;
                case 'eightoh': play808(time); break;
                case 'clap': playClap(time); break;
            }
        }

        function updateSteps(newSteps) {
            const oldSteps = STEPS;
            STEPS = newSteps;

            // Update pattern arrays
            Object.keys(pattern).forEach(track => {
                const oldPattern = pattern[track].slice();
                pattern[track] = new Array(STEPS).fill(false);
                // Copy over existing pattern up to the new length
                for (let i = 0; i < Math.min(oldSteps, STEPS); i++) {
                    pattern[track][i] = oldPattern[i];
                }
            });

            // Rebuild the sequencer UI
            createSteps();

            // Reset playback if playing
            if (isPlaying) {
                currentStep = currentStep % STEPS;
            }
        }

        function createSteps() {
            document.querySelectorAll('.track').forEach(track => {
                const trackName = track.dataset.track;
                const stepsContainer = track.querySelector('.steps');
                const label = track.querySelector('.track-label');

                // Clear existing steps
                stepsContainer.innerHTML = '';

                // Set up mute functionality (only once)
                if (!label.hasAttribute('data-listener-attached')) {
                    label.addEventListener('click', () => {
                        muted[trackName] = !muted[trackName];
                        track.classList.toggle('muted', muted[trackName]);
                    });
                    label.setAttribute('data-listener-attached', 'true');
                }

                for (let i = 0; i < STEPS; i++) {
                    const step = document.createElement('button');
                    step.className = 'step';
                    step.dataset.step = i;

                    // Add active class if pattern has this step
                    if (pattern[trackName][i]) {
                        step.classList.add('active');
                    }

                    step.addEventListener('click', () => {
                        initAudio();
                        pattern[trackName][i] = !pattern[trackName][i];
                        step.classList.toggle('active');
                        if (pattern[trackName][i]) {
                            playSound(trackName);
                        }
                    });

                    stepsContainer.appendChild(step);
                }
            });
        }

        function updatePlayhead() {
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('playing');
            });

            document.querySelectorAll('.track').forEach(track => {
                const step = track.querySelector(`.step[data-step="${currentStep}"]`);
                if (step) step.classList.add('playing');
            });
        }

        function playStep() {
            updatePlayhead();

            Object.keys(pattern).forEach(track => {
                if (pattern[track][currentStep] && !muted[track]) {
                    playSound(track);
                }
            });

            currentStep = (currentStep + 1) % STEPS;
        }

        function togglePlay() {
            initAudio();
            isPlaying = !isPlaying;
            const playBtn = document.getElementById('playBtn');

            if (isPlaying) {
                playBtn.textContent = 'Stop';
                playBtn.classList.add('active');
                const bpm = parseInt(document.getElementById('bpm').value);
                const interval = (60 / bpm / 4) * 1000;
                playStep();
                intervalId = setInterval(playStep, interval);
            } else {
                playBtn.textContent = 'Play';
                playBtn.classList.remove('active');
                clearInterval(intervalId);
                currentStep = 0;
                document.querySelectorAll('.step').forEach(step => {
                    step.classList.remove('playing');
                });
            }
        }

        function clearPattern() {
            Object.keys(pattern).forEach(track => {
                pattern[track].fill(false);
            });
            document.querySelectorAll('.step').forEach(step => {
                step.classList.remove('active');
            });
        }

        function renderToBuffer(callback) {
            const bpm = parseInt(document.getElementById('bpm').value);
            const stepDuration = 60 / bpm / 4;
            const loopDuration = stepDuration * STEPS;
            const sampleRate = 44100;
            const bufferLength = Math.ceil(loopDuration * sampleRate);

            const offlineContext = new OfflineAudioContext(2, bufferLength, sampleRate);

            function renderKick(ctx, time) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.frequency.setValueAtTime(150, time);
                osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.5);

                gain.gain.setValueAtTime(1, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.5);

                osc.start(time);
                osc.stop(time + 0.5);
            }

            function renderSnare(ctx, time) {
                const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
                const output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < noiseBuffer.length; i++) {
                    output[i] = Math.random() * 2 - 1;
                }

                const noise = ctx.createBufferSource();
                noise.buffer = noiseBuffer;

                const noiseFilter = ctx.createBiquadFilter();
                noiseFilter.type = 'highpass';
                noiseFilter.frequency.value = 1000;

                const noiseGain = ctx.createGain();
                noiseGain.gain.setValueAtTime(1, time);
                noiseGain.gain.exponentialRampToValueAtTime(0.01, time + 0.2);

                noise.connect(noiseFilter);
                noiseFilter.connect(noiseGain);
                noiseGain.connect(ctx.destination);

                const osc = ctx.createOscillator();
                const oscGain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(100, time);
                osc.frequency.exponentialRampToValueAtTime(0.01, time + 0.1);

                oscGain.gain.setValueAtTime(0.7, time);
                oscGain.gain.exponentialRampToValueAtTime(0.01, time + 0.1);

                osc.connect(oscGain);
                oscGain.connect(ctx.destination);

                noise.start(time);
                osc.start(time);
                osc.stop(time + 0.2);
            }

            function renderHiHat(ctx, time, open) {
                const fundamental = 40;
                const ratios = [2, 3, 4.16, 5.43, 6.79, 8.21];

                const gain = ctx.createGain();
                gain.connect(ctx.destination);

                const duration = open ? 0.3 : 0.08;

                gain.gain.setValueAtTime(0.3, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + duration);

                const bandpass = ctx.createBiquadFilter();
                bandpass.type = 'bandpass';
                bandpass.frequency.value = 10000;
                bandpass.connect(gain);

                const highpass = ctx.createBiquadFilter();
                highpass.type = 'highpass';
                highpass.frequency.value = 7000;
                highpass.connect(bandpass);

                ratios.forEach(ratio => {
                    const osc = ctx.createOscillator();
                    osc.type = 'square';
                    osc.frequency.value = fundamental * ratio;
                    osc.connect(highpass);
                    osc.start(time);
                    osc.stop(time + duration);
                });
            }

            function render808(ctx, time) {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.frequency.setValueAtTime(55, time);
                osc.frequency.exponentialRampToValueAtTime(30, time + 0.15);

                gain.gain.setValueAtTime(1.2, time);
                gain.gain.exponentialRampToValueAtTime(0.01, time + 0.8);

                osc.start(time);
                osc.stop(time + 0.8);
            }

            function renderClap(ctx, time) {
                const burstCount = 4;
                const burstSpacing = 0.01;

                for (let i = 0; i < burstCount; i++) {
                    const noiseBuffer = ctx.createBuffer(1, ctx.sampleRate * 0.15, ctx.sampleRate);
                    const output = noiseBuffer.getChannelData(0);

                    for (let j = 0; j < noiseBuffer.length; j++) {
                        output[j] = Math.random() * 2 - 1;
                    }

                    const noise = ctx.createBufferSource();
                    noise.buffer = noiseBuffer;

                    const filter = ctx.createBiquadFilter();
                    filter.type = 'bandpass';
                    filter.frequency.value = 1200;
                    filter.Q.value = 0.5;

                    const gain = ctx.createGain();
                    const startTime = time + (i * burstSpacing);

                    gain.gain.setValueAtTime(0.8, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, startTime + 0.15);

                    noise.connect(filter);
                    filter.connect(gain);
                    gain.connect(ctx.destination);

                    noise.start(startTime);
                }
            }

            for (let step = 0; step < STEPS; step++) {
                const time = step * stepDuration;

                if (pattern.kick[step] && !muted.kick) renderKick(offlineContext, time);
                if (pattern.snare[step] && !muted.snare) renderSnare(offlineContext, time);
                if (pattern.hihat[step] && !muted.hihat) renderHiHat(offlineContext, time, false);
                if (pattern.openhat[step] && !muted.openhat) renderHiHat(offlineContext, time, true);
                if (pattern.eightoh[step] && !muted.eightoh) render808(offlineContext, time);
                if (pattern.clap[step] && !muted.clap) renderClap(offlineContext, time);
            }

            offlineContext.startRendering().then(callback);
        }

        function bufferToWav(buffer) {
            const numChannels = buffer.numberOfChannels;
            const sampleRate = buffer.sampleRate;
            const format = 1;
            const bitDepth = 16;

            const bytesPerSample = bitDepth / 8;
            const blockAlign = numChannels * bytesPerSample;

            const dataLength = buffer.length * blockAlign;
            const bufferLength = 44 + dataLength;

            const arrayBuffer = new ArrayBuffer(bufferLength);
            const view = new DataView(arrayBuffer);

            function writeString(offset, string) {
                for (let i = 0; i < string.length; i++) {
                    view.setUint8(offset + i, string.charCodeAt(i));
                }
            }

            writeString(0, 'RIFF');
            view.setUint32(4, 36 + dataLength, true);
            writeString(8, 'WAVE');
            writeString(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, format, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * blockAlign, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitDepth, true);
            writeString(36, 'data');
            view.setUint32(40, dataLength, true);

            const channels = [];
            for (let i = 0; i < numChannels; i++) {
                channels.push(buffer.getChannelData(i));
            }

            let offset = 44;
            for (let i = 0; i < buffer.length; i++) {
                for (let ch = 0; ch < numChannels; ch++) {
                    const sample = Math.max(-1, Math.min(1, channels[ch][i]));
                    const intSample = sample < 0 ? sample * 0x8000 : sample * 0x7FFF;
                    view.setInt16(offset, intSample, true);
                    offset += 2;
                }
            }

            return new Blob([arrayBuffer], { type: 'audio/wav' });
        }

        function downloadWav() {
            initAudio();

            const hasNotes = Object.values(pattern).some(track => track.some(step => step));
            if (!hasNotes) {
                alert('Add some beats to your pattern first!');
                return;
            }

            renderToBuffer(buffer => {
                const blob = bufferToWav(buffer);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'drum-loop.wav';
                a.click();
                URL.revokeObjectURL(url);
            });
        }

        function randomizePattern() {
            // Clear existing pattern
            Object.keys(pattern).forEach(track => pattern[track].fill(false));

            // Scale patterns based on current step count (patterns are designed for 16 steps)
            const scale = (index) => Math.floor(index * STEPS / 16);
            const scalePattern = (arr) => arr.map(scale).filter(i => i < STEPS);

            // Kick patterns - always on beat 1, usually on beat 3, with variations
            const kickPatterns = [
                [0, 8],                    // Basic four-on-floor half
                [0, 6, 8],                 // With pickup
                [0, 8, 10],                // With off-beat
                [0, 3, 8, 11],             // Syncopated
                [0, 6, 8, 14],             // Funk style
                [0, 8, 12, 14],            // Driving
            ];
            const kickPattern = scalePattern(kickPatterns[Math.floor(Math.random() * kickPatterns.length)]);
            kickPattern.forEach(i => pattern.kick[i] = true);

            // Snare patterns - usually on beats 2 and 4
            const snarePatterns = [
                [4, 12],                   // Standard backbeat
                [4, 12],                   // Standard (weighted)
                [4, 10, 12],               // With ghost note
                [4, 12, 14],               // With fill
                [2, 4, 12],                // Offset
            ];
            const snarePattern = scalePattern(snarePatterns[Math.floor(Math.random() * snarePatterns.length)]);
            snarePattern.forEach(i => pattern.snare[i] = true);

            // Hi-hat patterns
            const hihatPatterns = [
                [0, 2, 4, 6, 8, 10, 12, 14],           // 8th notes
                [0, 4, 8, 12],                          // Quarter notes
                [0, 2, 4, 6, 8, 10, 12, 14],           // 8th notes (weighted)
                [0, 2, 3, 4, 6, 8, 10, 11, 12, 14],    // With 16th accents
                [2, 6, 10, 14],                         // Off-beats only
                [0, 2, 4, 5, 6, 8, 10, 12, 13, 14],    // Busy pattern
            ];
            const hihatPattern = scalePattern(hihatPatterns[Math.floor(Math.random() * hihatPatterns.length)]);
            hihatPattern.forEach(i => pattern.hihat[i] = true);

            // Open hi-hat - sparse, usually before snare or at phrase end
            const openhatPatterns = [
                [],                        // None
                [3],                       // Before beat 2
                [11],                      // Before beat 4
                [3, 11],                   // Before both snares
                [7],                       // Mid-bar accent
                [15],                      // End of bar
            ];
            const openhatPattern = scalePattern(openhatPatterns[Math.floor(Math.random() * openhatPatterns.length)]);
            openhatPattern.forEach(i => {
                if (i < STEPS) {
                    pattern.openhat[i] = true;
                    pattern.hihat[i] = false;  // Remove closed hat where open hat plays
                }
            });

            // 808 patterns - sparse, often with kick or on its own for bass
            const eightohPatterns = [
                [],                        // None (most common)
                [],                        // None (weighted)
                [0],                       // On beat 1
                [0, 8],                    // On beats 1 and 3
                [0, 10],                   // With anticipation
                [4, 12],                   // Counter to kick
            ];
            const eightohPattern = scalePattern(eightohPatterns[Math.floor(Math.random() * eightohPatterns.length)]);
            eightohPattern.forEach(i => pattern.eightoh[i] = true);

            // Clap patterns - often doubles or replaces snare
            const clapPatterns = [
                [],                        // None
                [],                        // None (weighted)
                [4, 12],                   // With snare
                [12],                      // Just beat 4
                [4],                       // Just beat 2
            ];
            const clapPattern = scalePattern(clapPatterns[Math.floor(Math.random() * clapPatterns.length)]);
            clapPattern.forEach(i => pattern.clap[i] = true);

            // Update UI
            document.querySelectorAll('.track').forEach(trackEl => {
                const trackName = trackEl.dataset.track;
                trackEl.querySelectorAll('.step').forEach((step, i) => {
                    step.classList.toggle('active', pattern[trackName][i]);
                });
            });
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && e.target.tagName !== 'INPUT') {
                e.preventDefault();
                togglePlay();
            }
        });

        document.getElementById('playBtn').addEventListener('click', togglePlay);
        document.getElementById('clearBtn').addEventListener('click', clearPattern);
        document.getElementById('randomBtn').addEventListener('click', randomizePattern);
        document.getElementById('downloadBtn').addEventListener('click', downloadWav);

        const bpmInput = document.getElementById('bpm');
        const stepsInput = document.getElementById('steps');

        function updateBpm() {
            if (isPlaying) {
                clearInterval(intervalId);
                const bpm = parseInt(bpmInput.value);
                const interval = (60 / bpm / 4) * 1000;
                intervalId = setInterval(playStep, interval);
            }
        }

        bpmInput.addEventListener('change', updateBpm);

        bpmInput.addEventListener('wheel', (e) => {
            e.preventDefault();
            const delta = e.deltaY > 0 ? -1 : 1;
            const newValue = Math.min(200, Math.max(60, parseInt(bpmInput.value) + delta));
            bpmInput.value = newValue;
            updateBpm();
        }, { passive: false });

        // On mobile, ensure the input is focusable for native picker
        if (isMobileDevice()) {
            bpmInput.addEventListener('touchstart', (e) => {
                bpmInput.focus();
            });
        }

        // BPM arrow buttons
        document.getElementById('bpmUp')?.addEventListener('click', () => {
            const newValue = Math.min(200, parseInt(bpmInput.value) + 1);
            bpmInput.value = newValue;
            updateBpm();
        });

        document.getElementById('bpmDown')?.addEventListener('click', () => {
            const newValue = Math.max(60, parseInt(bpmInput.value) - 1);
            bpmInput.value = newValue;
            updateBpm();
        });

        stepsInput.addEventListener('change', () => {
            const newSteps = parseInt(stepsInput.value);
            updateSteps(newSteps);
        });

        // Initialize with mobile-appropriate default
        const defaultSteps = isMobileDevice() ? 8 : 16;
        stepsInput.value = defaultSteps;
        updateSteps(defaultSteps);
    </script>
</body>
</html>
