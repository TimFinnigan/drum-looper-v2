<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Looper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: radial-gradient(ellipse at 50% 0%, #3d2b50 0%, #1f1728 55%, #130f1b 100%);
      background-attachment: fixed;
      color: #f3e9f0;
      font-family: Georgia, 'Times New Roman', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }

    h1 {
      font-size: 1.1rem;
      font-weight: normal;
      font-style: italic;
      letter-spacing: 0.45em;
      color: #b9a3c4;
      margin-bottom: 10px;
      text-transform: lowercase;
    }

    .progression {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      min-height: 26px;
    }

    .chord {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      padding: 4px 12px;
      border-radius: 14px;
      color: #8f7d9c;
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: color 0.4s, background 0.4s, border-color 0.4s, box-shadow 0.4s;
    }

    .chord.active {
      color: #fbeaf3;
      background: rgba(240, 184, 212, 0.16);
      border-color: rgba(240, 184, 212, 0.5);
      box-shadow: 0 0 14px rgba(240, 184, 212, 0.3);
    }

    .matrix-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .labels {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 18px; /* aligns with grid rows (step dots height + gap) */
    }

    .label {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 0.75rem;
      font-style: italic;
      letter-spacing: 0.1em;
      padding-right: 6px;
      opacity: 0.8;
      white-space: nowrap;
    }

    .grid-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-dots {
      display: flex;
      gap: 3px;
    }

    .step-dot {
      width: 38px;
      height: 5px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.06);
      transition: background 0.1s;
    }

    .step-dot.active {
      background: #f0b8d4;
      box-shadow: 0 0 8px 2px rgba(240, 184, 212, 0.5);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(16, 38px);
      grid-template-rows: repeat(8, 38px);
      gap: 3px;
    }

    .cell {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.045);
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.07);
      transition: background 0.1s, box-shadow 0.1s, border-color 0.1s;
    }

    .cell:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .cell.active {
      border-color: transparent;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px 18px;
      margin-top: 22px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 760px;
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      color: #cdbad6;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 16px;
      padding: 8px 22px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: lowercase;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, color 0.2s;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(240, 184, 212, 0.5);
      color: #fff;
    }

    #play-btn.playing {
      border-color: #f0b8d4;
      color: #f0b8d4;
    }

    .slider-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      font-style: italic;
      letter-spacing: 0.12em;
      color: #9a88a8;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100px;
      height: 3px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      background: #f0b8d4;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 8px rgba(240, 184, 212, 0.6);
    }

    input[type="range"]::-moz-range-thumb {
      width: 13px;
      height: 13px;
      background: #f0b8d4;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }

    .val {
      color: #f0b8d4;
      min-width: 28px;
      text-align: right;
      font-style: normal;
    }

    .select-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      font-style: italic;
      letter-spacing: 0.12em;
      color: #9a88a8;
    }

    .select-control select {
      background: rgba(255, 255, 255, 0.05);
      color: #cdbad6;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 5px 8px;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 0.7rem;
      cursor: pointer;
      outline: none;
    }

    .select-control select:hover {
      border-color: rgba(240, 184, 212, 0.5);
    }

    .select-control option {
      background: #1f1728;
    }

    .key-guide {
      margin-top: 18px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .key-guide:hover {
      opacity: 1;
    }

    .key-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.6rem;
      font-style: italic;
      letter-spacing: 0.1em;
      color: #8f7d9c;
    }

    .key-hint kbd {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 4px;
      padding: 2px 6px;
      font-family: Georgia, 'Times New Roman', serif;
      font-style: normal;
      font-size: 0.6rem;
      color: #cdbad6;
    }
  </style>
</head>
<body>

<h1>dream looper</h1>
<div class="progression" id="progression"></div>

<div class="matrix-wrapper">
  <div class="labels" id="labels"></div>
  <div class="grid-column">
    <div class="step-dots" id="step-dots"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="controls">
  <button id="play-btn">Play</button>
  <button id="clear-btn">Clear</button>
  <button id="random-btn">Random</button>
  <button id="wav-btn">Export</button>
  <div class="slider-control">
    <span>BPM</span>
    <input type="range" id="bpm-slider" min="50" max="140" value="78">
    <span class="val" id="bpm-val">78</span>
  </div>
  <div class="slider-control">
    <span>Haze</span>
    <input type="range" id="haze-slider" min="0" max="100" value="55">
  </div>
  <div class="slider-control">
    <span>Tone</span>
    <input type="range" id="tone-slider" min="1200" max="9000" value="4500">
  </div>
  <div class="select-control">
    <span>Key</span>
    <select id="key-select"></select>
  </div>
  <div class="select-control">
    <span>Mood</span>
    <select id="mood-select">
      <option value="dream" selected>Dream</option>
      <option value="haze">Haze</option>
    </select>
  </div>
  <div class="select-control">
    <span>Steps</span>
    <select id="steps-select">
      <option value="8">8</option>
      <option value="16" selected>16</option>
      <option value="32">32</option>
    </select>
  </div>
</div>

<div class="key-guide">
  <span class="key-hint"><kbd>Space</kbd> play / stop</span>
  <span class="key-hint"><kbd>R</kbd> random</span>
  <span class="key-hint"><kbd>E</kbd> export wav</span>
  <span class="key-hint"><kbd>↑</kbd><kbd>↓</kbd> bpm ±5</span>
</div>

<script>
  const ROWS = 8;
  const MAX_COLS = 32;

  const TRACKS = [
    { name: 'Kick',  color: '#e8a0b4', glow: 'rgba(232,160,180,0.4)' },
    { name: 'Snare', color: '#f2c6a0', glow: 'rgba(242,198,160,0.4)' },
    { name: 'Hat',   color: '#f6e7b4', glow: 'rgba(246,231,180,0.4)' },
    { name: 'Rim',   color: '#b8d4c8', glow: 'rgba(184,212,200,0.4)' },
    { name: 'Bass',  color: '#9bb4e0', glow: 'rgba(155,180,224,0.4)' },
    { name: 'Pad',   color: '#c3a6e8', glow: 'rgba(195,166,232,0.4)' },
    { name: 'Keys',  color: '#e8b4d8', glow: 'rgba(232,180,216,0.4)' },
    { name: 'Bell',  color: '#a8e0e8', glow: 'rgba(168,224,232,0.4)' },
  ];

  const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

  // One chord per pass through the loop. tones are semitones above the chord root.
  const MOODS = {
    dream: [
      { iv: 0, tones: [0, 4, 7, 11], sfx: 'maj7' },
      { iv: 9, tones: [0, 3, 7, 10], sfx: 'm7' },
      { iv: 5, tones: [0, 4, 7, 11], sfx: 'maj7' },
      { iv: 7, tones: [0, 4, 7, 14], sfx: 'add9' },
    ],
    haze: [
      { iv: 0,  tones: [0, 3, 7, 10], sfx: 'm7' },
      { iv: 8,  tones: [0, 4, 7, 11], sfx: 'maj7' },
      { iv: 3,  tones: [0, 4, 7, 11], sfx: 'maj7' },
      { iv: 10, tones: [0, 4, 7, 14], sfx: 'add9' },
    ],
  };

  const ARP = [0, 2, 1, 3, 2, 1, 3, 2];

  // State
  const gridState = Array.from({ length: ROWS }, () => Array(MAX_COLS).fill(false));
  let numCols = 16;
  let currentStep = -1;
  let isPlaying = false;
  let bpm = 78;
  let keyRoot = 2; // D
  let mood = 'dream';
  let loopCount = -1;
  let pendingChordIdx = -1;
  let audioCtx = null;
  let nextStepTime = 0;
  let schedulerTimer = null;
  const settings = { haze: 0.55, tone: 4500 };

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // ── Harmony ─────────────────────────────────────────────────────

  const hz = (midi) => 440 * Math.pow(2, (midi - 69) / 12);

  function chordAt(idx) {
    const prog = MOODS[mood];
    const c = prog[((idx % prog.length) + prog.length) % prog.length];
    const pc = (keyRoot + c.iv) % 12;
    return { name: NOTE_NAMES[pc] + c.sfx, base: 45 + pc, tones: c.tones };
  }

  // ── Effects bus: warm tone, long dark reverb, dotted-eighth tape delay ──

  const buses = new WeakMap();
  const noiseBufs = new WeakMap();

  function makeImpulse(ctx, seconds = 4, decay = 2.4) {
    const sr = ctx.sampleRate;
    const len = Math.floor(sr * seconds);
    const pre = Math.floor(sr * 0.025);
    const buf = ctx.createBuffer(2, len, sr);
    for (let ch = 0; ch < 2; ch++) {
      const d = buf.getChannelData(ch);
      let lp = 0;
      for (let i = pre; i < len; i++) {
        const t = (i - pre) / (len - pre);
        lp += ((Math.random() * 2 - 1) - lp) * (0.6 - 0.5 * t); // tail gets darker
        d[i] = lp * Math.pow(1 - t, decay);
      }
    }
    return buf;
  }

  function bus(ctx) {
    let b = buses.get(ctx);
    if (b) return b;

    const input = ctx.createGain();
    const tone = ctx.createBiquadFilter();
    tone.type = 'lowpass'; tone.frequency.value = settings.tone; tone.Q.value = 0.4;

    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 24; comp.ratio.value = 3;
    comp.attack.value = 0.01; comp.release.value = 0.3;
    const out = ctx.createGain(); out.gain.value = 0.9;

    // reverb, with lows cut from the send so kick and bass stay clear
    const verbSend = ctx.createGain(); verbSend.gain.value = settings.haze;
    const verbHp = ctx.createBiquadFilter(); verbHp.type = 'highpass'; verbHp.frequency.value = 250;
    const verb = ctx.createConvolver(); verb.buffer = makeImpulse(ctx);
    const verbOut = ctx.createGain(); verbOut.gain.value = 0.8;

    // tape delay
    const delay = ctx.createDelay(2); delay.delayTime.value = stepDuration() * 3;
    const delaySend = ctx.createGain(); delaySend.gain.value = 0.22;
    const fbLp = ctx.createBiquadFilter(); fbLp.type = 'lowpass'; fbLp.frequency.value = 2200;
    const fb = ctx.createGain(); fb.gain.value = 0.38;

    input.connect(tone);
    tone.connect(comp);
    tone.connect(verbSend); verbSend.connect(verbHp); verbHp.connect(verb); verb.connect(verbOut); verbOut.connect(comp);
    tone.connect(delaySend); delaySend.connect(delay); delay.connect(fbLp);
    fbLp.connect(fb); fb.connect(delay);
    fbLp.connect(comp); fbLp.connect(verbSend);
    comp.connect(out); out.connect(ctx.destination);

    b = { input, tone, verbSend, delay };
    buses.set(ctx, b);
    return b;
  }

  const dest = (ctx) => bus(ctx).input;

  function noiseSrc(ctx) {
    let buf = noiseBufs.get(ctx);
    if (!buf) {
      buf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      noiseBufs.set(ctx, buf);
    }
    const src = ctx.createBufferSource();
    src.buffer = buf;
    return src;
  }

  function updateBus() {
    if (!audioCtx) return;
    const b = bus(audioCtx);
    const now = audioCtx.currentTime;
    b.tone.frequency.setTargetAtTime(settings.tone, now, 0.05);
    b.verbSend.gain.setTargetAtTime(settings.haze, now, 0.05);
    b.delay.delayTime.setTargetAtTime(stepDuration() * 3, now, 0.1);
  }

  // ── Voices ──────────────────────────────────────────────────────
  // Soft, boxy drum machine sounds plus a small keys and pad palette.

  function playKick(ctx, t) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(dest(ctx));
    osc.frequency.setValueAtTime(115, t);
    osc.frequency.exponentialRampToValueAtTime(46, t + 0.14);
    g.gain.setValueAtTime(0.9, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.38);
    osc.start(t); osc.stop(t + 0.4);
  }

  function playSnare(ctx, t) {
    const noise = noiseSrc(ctx);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = 0.6;
    const g = ctx.createGain();
    noise.connect(bp); bp.connect(g); g.connect(dest(ctx));
    g.gain.setValueAtTime(0.45, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    noise.start(t, Math.random()); noise.stop(t + 0.3);

    const osc = ctx.createOscillator(); osc.type = 'triangle';
    osc.frequency.setValueAtTime(190, t); osc.frequency.exponentialRampToValueAtTime(140, t + 0.1);
    const g2 = ctx.createGain();
    osc.connect(g2); g2.connect(dest(ctx));
    g2.gain.setValueAtTime(0.35, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.start(t); osc.stop(t + 0.14);
  }

  function playHat(ctx, t) {
    const noise = noiseSrc(ctx);
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 6500;
    const g = ctx.createGain();
    noise.connect(hp); hp.connect(g); g.connect(dest(ctx));
    g.gain.setValueAtTime(0.18, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    noise.start(t, Math.random()); noise.stop(t + 0.08);
  }

  function playRim(ctx, t) {
    const osc = ctx.createOscillator();
    osc.frequency.setValueAtTime(1500, t); osc.frequency.exponentialRampToValueAtTime(850, t + 0.03);
    const g = ctx.createGain();
    osc.connect(g); g.connect(dest(ctx));
    g.gain.setValueAtTime(0.3, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.06);
    osc.start(t); osc.stop(t + 0.08);

    const noise = noiseSrc(ctx);
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 3000;
    const g2 = ctx.createGain();
    noise.connect(bp); bp.connect(g2); g2.connect(dest(ctx));
    g2.gain.setValueAtTime(0.15, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    noise.start(t, Math.random()); noise.stop(t + 0.04);
  }

  function playBass(ctx, t, chord) {
    const f = hz(chord.base - 12);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const g = ctx.createGain();
    lp.connect(g); g.connect(dest(ctx));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.6, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
    [['sine', 1, 1], ['triangle', 2, 0.25]].forEach(([type, mult, gain]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f * mult;
      const og = ctx.createGain(); og.gain.value = gain;
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + 1.15);
    });
  }

  function playPad(ctx, t, chord) {
    const dur = stepDuration() * 8;
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.3;
    lp.frequency.setValueAtTime(500, t);
    lp.frequency.linearRampToValueAtTime(1300, t + dur * 0.6);
    const g = ctx.createGain();
    lp.connect(g); g.connect(dest(ctx));
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(0.045, t + 0.5);
    g.gain.setTargetAtTime(0, t + dur, 0.6);
    chord.tones.forEach(iv => {
      [-7, 7].forEach(cents => {
        const o = ctx.createOscillator(); o.type = 'sawtooth';
        o.frequency.value = hz(chord.base + iv); o.detune.value = cents;
        o.connect(lp);
        o.start(t); o.stop(t + dur + 4);
      });
    });
  }

  function playKeys(ctx, t, chord, col) {
    const f = hz(chord.base + 12 + chord.tones[ARP[col % ARP.length]]);
    const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
    const g = ctx.createGain();
    lp.connect(g); g.connect(dest(ctx));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.2, t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);

    const lfo = ctx.createOscillator(); lfo.frequency.value = 5;
    const lfoGain = ctx.createGain(); lfoGain.gain.value = 7; // cents of wobble
    lfo.connect(lfoGain);
    lfo.start(t); lfo.stop(t + 0.95);

    [['square', 1, 0.5], ['triangle', 2, 0.35]].forEach(([type, mult, gain]) => {
      const o = ctx.createOscillator(); o.type = type; o.frequency.value = f * mult;
      lfoGain.connect(o.detune);
      const og = ctx.createGain(); og.gain.value = gain;
      o.connect(og); og.connect(lp);
      o.start(t); o.stop(t + 0.95);
    });
  }

  function playBell(ctx, t, chord, col) {
    const iv = chord.tones[[3, 2, 1, 0][col % 4]] % 12;
    const f = hz(chord.base + 24 + iv);
    const g = ctx.createGain();
    g.connect(dest(ctx));
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.14, t + 0.005);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 1.6);
    [[1, 1], [3, 0.12]].forEach(([mult, gain]) => {
      const o = ctx.createOscillator(); o.frequency.value = f * mult;
      const og = ctx.createGain(); og.gain.value = gain;
      o.connect(og); og.connect(g);
      o.start(t); o.stop(t + 1.65);
    });
  }

  const PLAY_FNS = [playKick, playSnare, playHat, playRim, playBass, playPad, playKeys, playBell];

  // ── Precise scheduler ───────────────────────────────────────────
  // Schedule audio ~100ms ahead, update visuals with requestAnimationFrame

  const LOOKAHEAD_MS = 100;
  const SCHEDULE_INTERVAL_MS = 25;

  let pendingVisualStep = -1;

  function stepDuration() {
    return 60 / bpm / 4;
  }

  function scheduler() {
    const ctx = getCtx();
    while (nextStepTime < ctx.currentTime + LOOKAHEAD_MS / 1000) {
      const step = (currentStep + 1) % numCols;
      if (step === 0) loopCount++;
      currentStep = step;
      pendingVisualStep = step;
      pendingChordIdx = loopCount % MOODS[mood].length;
      const chord = chordAt(loopCount);
      for (let row = 0; row < ROWS; row++) {
        if (gridState[row][step]) PLAY_FNS[row](ctx, nextStepTime, chord, step);
      }
      nextStepTime += stepDuration();
    }
  }

  function startScheduler() {
    const ctx = getCtx();
    loopCount = -1;
    nextStepTime = ctx.currentTime;
    schedulerTimer = setInterval(scheduler, SCHEDULE_INTERVAL_MS);
    rafLoop();
  }

  function stopScheduler() {
    clearInterval(schedulerTimer);
    schedulerTimer = null;
  }

  let rafHandle = null;
  let lastVisualStep = -1;

  function rafLoop() {
    if (!isPlaying) return;
    if (pendingVisualStep !== lastVisualStep) {
      lastVisualStep = pendingVisualStep;
      updateVisuals(pendingVisualStep);
    }
    rafHandle = requestAnimationFrame(rafLoop);
  }

  // ── UI building ─────────────────────────────────────────────────

  const labelsEl = document.getElementById('labels');
  const stepDotsEl = document.getElementById('step-dots');
  const gridEl = document.getElementById('grid');
  const progressionEl = document.getElementById('progression');
  const cells = []; // cells[row][col]

  function buildUI() {
    labelsEl.innerHTML = '';
    stepDotsEl.innerHTML = '';
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateColumns = `repeat(${numCols}, 38px)`;
    cells.length = 0;

    TRACKS.forEach((track, row) => {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = track.name;
      label.style.color = track.color;
      labelsEl.appendChild(label);
    });

    for (let col = 0; col < numCols; col++) {
      const dot = document.createElement('div');
      dot.className = 'step-dot';
      stepDotsEl.appendChild(dot);
    }

    for (let row = 0; row < ROWS; row++) {
      cells[row] = [];
      for (let col = 0; col < numCols; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = row;
        cell.dataset.col = col;
        applyCellStyle(cell, row, col, false);
        cell.addEventListener('mousedown', onCellMouseDown);
        cell.addEventListener('mouseenter', onCellMouseEnter);
        gridEl.appendChild(cell);
        cells[row][col] = cell;
      }
    }
  }

  function buildProgression() {
    progressionEl.innerHTML = '';
    MOODS[mood].forEach((_, i) => {
      const el = document.createElement('span');
      el.className = 'chord';
      el.textContent = chordAt(i).name;
      progressionEl.appendChild(el);
    });
  }

  function markChord(idx) {
    [...progressionEl.children].forEach((el, i) => el.classList.toggle('active', i === idx));
  }

  // drag-to-paint support
  let dragActive = false;
  let dragValue = false; // what we're painting (true=on, false=off)

  document.addEventListener('mouseup', () => { dragActive = false; });

  function onCellMouseDown(e) {
    e.preventDefault();
    const row = +this.dataset.row;
    const col = +this.dataset.col;
    dragValue = !gridState[row][col];
    dragActive = true;
    gridState[row][col] = dragValue;
    applyCellStyle(this, row, col, col === currentStep);
  }

  function onCellMouseEnter() {
    if (!dragActive) return;
    const row = +this.dataset.row;
    const col = +this.dataset.col;
    gridState[row][col] = dragValue;
    applyCellStyle(this, row, col, col === currentStep);
  }

  function applyCellStyle(cell, row, col, isHead) {
    const track = TRACKS[row];
    const on = gridState[row][col];

    if (on && isHead) {
      cell.style.background = track.color;
      cell.style.boxShadow = `0 0 12px 3px ${track.glow}, 0 0 28px 8px ${track.glow}`;
      cell.style.borderColor = 'transparent';
    } else if (on) {
      cell.style.background = track.color + '99';
      cell.style.boxShadow = `0 0 8px 2px ${track.glow}`;
      cell.style.borderColor = 'transparent';
    } else if (isHead) {
      cell.style.background = 'rgba(255, 255, 255, 0.1)';
      cell.style.boxShadow = 'none';
      cell.style.borderColor = 'rgba(255, 255, 255, 0.18)';
    } else {
      cell.style.background = '';
      cell.style.boxShadow = '';
      cell.style.borderColor = '';
    }
  }

  function updateVisuals(step) {
    const dots = stepDotsEl.children;
    for (let c = 0; c < numCols; c++) {
      dots[c].className = 'step-dot' + (c === step ? ' active' : '');
    }
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < numCols; col++) {
        if (cells[row] && cells[row][col]) {
          applyCellStyle(cells[row][col], row, col, col === step);
        }
      }
    }
    markChord(step === -1 ? -1 : pendingChordIdx);
  }

  // ── Patterns ────────────────────────────────────────────────────

  function clearGrid() {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < MAX_COLS; c++)
        gridState[r][c] = false;
  }

  // Sparse, half-time starter loop (16 steps)
  function starterPattern() {
    clearGrid();
    const set = (row, cols) => cols.forEach(c => { gridState[row][c] = true; });
    set(0, [0, 10]);
    set(1, [8]);
    set(2, [2, 6, 10, 14]);
    set(3, [13]);
    set(4, [0, 10]);
    set(5, [0]);
    set(6, [0, 3, 6, 8, 11, 14]);
    set(7, [7, 15]);
  }

  // Minimalist randomizer: half-time drums, a long pad, a slow arp
  function randomize() {
    clearGrid();

    const n = numCols;
    const maybe = (p) => Math.random() < p;
    const on = (row, col) => { const c = Math.round(col); if (c >= 0 && c < n) gridState[row][c] = true; };

    const q = n / 4;
    const e = n / 8;
    const s = n / 16;
    const b1 = 0, b2 = q, b3 = 2 * q, b4 = 3 * q;

    // Kick: beat 1 plus a soft pickup or two
    on(0, b1);
    if (maybe(0.7)) on(0, b3 + 2 * s);
    if (maybe(0.3)) on(0, b2 + 3 * s);
    if (maybe(0.25)) on(0, b3);

    // Snare: half-time on 3, sometimes a ghost
    on(1, b3);
    if (maybe(0.2)) on(1, b4 + 3 * s);

    // Hat: sparse offbeats
    const hatType = Math.floor(Math.random() * 3);
    if (hatType === 0) {
      for (let i = 0; i < 4; i++) on(2, i * q + 2 * s);
    } else if (hatType === 1) {
      for (let i = 0; i < 8; i++) if (maybe(0.55)) on(2, i * e);
    } else {
      for (let i = 0; i < 4; i++) if (maybe(0.7)) on(2, i * q + 2 * s);
    }

    // Rim
    if (maybe(0.5)) on(3, b4 + 2 * s);
    if (maybe(0.2)) on(3, b2 + 3 * s);

    // Bass follows the kick
    on(4, b1);
    if (maybe(0.5)) on(4, b3 + 2 * s);
    if (maybe(0.25)) on(4, b2 + 2 * s);

    // Pad: one long chord, sometimes re-struck halfway
    on(5, b1);
    if (maybe(0.3)) on(5, b3);

    // Keys: slow arp, three to six notes
    const arpSteps = [];
    for (let i = 0; i < 8; i++) if (maybe(0.55)) arpSteps.push(i * e);
    if (arpSteps.length < 3) arpSteps.push(b1 + e, b2 + e, b3 + e);
    arpSteps.forEach(t => on(6, t));

    // Bell: one to three high notes
    const bells = [b1 + 3 * s, b2 + 3 * s, b3 + 3 * s, b4 + s, b4 + 3 * s];
    bells.forEach(t => { if (maybe(0.3)) on(7, t); });
    if (!gridState[7].some(Boolean)) on(7, b4 + 3 * s);

    updateVisuals(isPlaying ? currentStep : -1);
  }

  // ── Controls ────────────────────────────────────────────────────

  const playBtn = document.getElementById('play-btn');
  const clearBtn = document.getElementById('clear-btn');
  const bpmSlider = document.getElementById('bpm-slider');
  const bpmVal = document.getElementById('bpm-val');
  const hazeSlider = document.getElementById('haze-slider');
  const toneSlider = document.getElementById('tone-slider');
  const keySelect = document.getElementById('key-select');
  const moodSelect = document.getElementById('mood-select');
  const stepsSelect = document.getElementById('steps-select');

  NOTE_NAMES.forEach((name, i) => {
    const opt = document.createElement('option');
    opt.value = i;
    opt.textContent = name;
    if (i === keyRoot) opt.selected = true;
    keySelect.appendChild(opt);
  });

  function setBpm(v) {
    bpm = Math.max(50, Math.min(140, v));
    bpmSlider.value = bpm;
    bpmVal.textContent = bpm;
    updateBus();
  }

  playBtn.addEventListener('click', () => {
    getCtx(); // init on gesture
    if (isPlaying) {
      isPlaying = false;
      stopScheduler();
      cancelAnimationFrame(rafHandle);
      currentStep = -1;
      pendingVisualStep = -1;
      lastVisualStep = -1;
      updateVisuals(-1);
      playBtn.textContent = 'Play';
      playBtn.classList.remove('playing');
    } else {
      isPlaying = true;
      currentStep = -1;
      pendingVisualStep = -1;
      lastVisualStep = -1;
      updateBus();
      startScheduler();
      playBtn.textContent = 'Stop';
      playBtn.classList.add('playing');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    if (e.code === 'KeyR') { e.preventDefault(); randomize(); }
    if (e.code === 'KeyE') { e.preventDefault(); exportWAV(); }
    if (e.code === 'ArrowUp')   { e.preventDefault(); setBpm(bpm + 5); }
    if (e.code === 'ArrowDown') { e.preventDefault(); setBpm(bpm - 5); }
  });

  document.getElementById('random-btn').addEventListener('click', randomize);

  // ── WAV Export ──────────────────────────────────────────────────

  function writeString(view, offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  function encodeWAV(buffer) {
    const numCh = buffer.numberOfChannels;
    const sr = buffer.sampleRate;
    const numSamples = buffer.length;
    const dataSize = numSamples * numCh * 2; // 16-bit
    const ab = new ArrayBuffer(44 + dataSize);
    const v = new DataView(ab);
    writeString(v, 0, 'RIFF');
    v.setUint32(4, 36 + dataSize, true);
    writeString(v, 8, 'WAVE');
    writeString(v, 12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); // PCM
    v.setUint16(22, numCh, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * numCh * 2, true);
    v.setUint16(32, numCh * 2, true);
    v.setUint16(34, 16, true);
    writeString(v, 36, 'data');
    v.setUint32(40, dataSize, true);
    let offset = 44;
    for (let i = 0; i < numSamples; i++) {
      for (let ch = 0; ch < numCh; ch++) {
        const s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
        v.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        offset += 2;
      }
    }
    return ab;
  }

  // Renders one pass per chord in the progression, plus a reverb tail
  async function exportWAV() {
    const hasAny = gridState.some(row => row.slice(0, numCols).some(Boolean));
    if (!hasAny) return;

    const wavBtn = document.getElementById('wav-btn');
    wavBtn.textContent = 'Rendering...';
    wavBtn.disabled = true;

    const sr = 44100;
    const passes = MOODS[mood].length;
    const patternDuration = numCols * stepDuration();
    const tail = 4;
    const totalSamples = Math.ceil(sr * (patternDuration * passes + tail));
    const offCtx = new OfflineAudioContext(2, totalSamples, sr);

    for (let pass = 0; pass < passes; pass++) {
      const chord = chordAt(pass);
      for (let col = 0; col < numCols; col++) {
        const t = (pass * numCols + col) * stepDuration();
        for (let row = 0; row < ROWS; row++) {
          if (gridState[row][col]) PLAY_FNS[row](offCtx, t, chord, col);
        }
      }
    }

    const rendered = await offCtx.startRendering();
    const wav = encodeWAV(rendered);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dream-loop.wav';
    a.click();
    URL.revokeObjectURL(url);

    wavBtn.textContent = 'Export';
    wavBtn.disabled = false;
  }

  document.getElementById('wav-btn').addEventListener('click', exportWAV);

  clearBtn.addEventListener('click', () => {
    clearGrid();
    updateVisuals(isPlaying ? currentStep : -1);
  });

  bpmSlider.addEventListener('input', () => setBpm(+bpmSlider.value));

  hazeSlider.addEventListener('input', () => {
    settings.haze = +hazeSlider.value / 100;
    updateBus();
  });

  toneSlider.addEventListener('input', () => {
    settings.tone = +toneSlider.value;
    updateBus();
  });

  keySelect.addEventListener('change', () => {
    keyRoot = +keySelect.value;
    buildProgression();
    markChord(isPlaying ? pendingChordIdx : -1);
  });

  moodSelect.addEventListener('change', () => {
    mood = moodSelect.value;
    buildProgression();
    markChord(isPlaying ? Math.max(pendingChordIdx, 0) : -1);
  });

  stepsSelect.addEventListener('change', () => {
    const wasPlaying = isPlaying;
    if (wasPlaying) {
      isPlaying = false;
      stopScheduler();
      cancelAnimationFrame(rafHandle);
    }
    numCols = +stepsSelect.value;
    currentStep = -1;
    pendingVisualStep = -1;
    lastVisualStep = -1;
    buildUI();
    if (wasPlaying) {
      isPlaying = true;
      startScheduler();
    }
  });

  // ── Init ────────────────────────────────────────────────────────
  starterPattern();
  buildProgression();
  buildUI();
</script>
</body>
</html>
