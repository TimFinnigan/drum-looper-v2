<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drum Looper</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #07070f;
      color: #fff;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      user-select: none;
    }

    h1 {
      font-size: 1.1rem;
      letter-spacing: 0.5em;
      color: #445;
      margin-bottom: 28px;
      text-transform: uppercase;
    }

    .matrix-wrapper {
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }

    .labels {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding-top: 18px; /* aligns with grid rows (step dots height + gap) */
    }

    .label {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding-right: 6px;
      opacity: 0.65;
      white-space: nowrap;
    }

    .grid-column {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .step-dots {
      display: flex;
      gap: 3px;
    }

    .step-dot {
      width: 38px;
      height: 5px;
      border-radius: 2px;
      background: #131320;
      transition: background 0.05s;
    }

    .step-dot.active {
      background: #00d4ff;
      box-shadow: 0 0 6px 2px rgba(0, 212, 255, 0.6);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(16, 38px);
      grid-template-rows: repeat(8, 38px);
      gap: 3px;
    }

    .cell {
      width: 38px;
      height: 38px;
      border-radius: 4px;
      background: #131320;
      cursor: pointer;
      border: 1px solid #1e1e36;
      transition: background 0.06s, box-shadow 0.06s, border-color 0.06s;
    }

    .cell:hover {
      background: #1e1e36;
      border-color: #2e2e56;
    }

    .cell.active {
      border-color: transparent;
    }

    /* flash class applied briefly when playhead hits an active cell */
    .cell.flash {
      filter: brightness(1.6);
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 14px;
      margin-top: 22px;
      flex-wrap: wrap;
      justify-content: center;
    }

    button {
      background: #131320;
      color: #aab;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 8px 22px;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.1s, border-color 0.1s, color 0.1s;
    }

    button:hover {
      background: #1e1e36;
      border-color: #4a4a7a;
      color: #fff;
    }

    #play-btn.playing {
      border-color: #00d4ff;
      color: #00d4ff;
    }

    .bpm-control {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #556;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 3px;
      background: #2a2a4a;
      border-radius: 2px;
      outline: none;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 13px;
      height: 13px;
      background: #00d4ff;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 6px rgba(0, 212, 255, 0.5);
    }

    #bpm-val {
      color: #00d4ff;
      min-width: 28px;
      text-align: right;
    }

    .steps-control {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: #556;
    }

    .steps-control select {
      background: #131320;
      color: #aab;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 5px 8px;
      font-family: 'Courier New', monospace;
      font-size: 0.7rem;
      cursor: pointer;
      outline: none;
    }

    .steps-control select:hover {
      border-color: #4a4a7a;
    }

    .key-guide {
      margin-top: 18px;
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      justify-content: center;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .key-guide:hover {
      opacity: 1;
    }

    .key-hint {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.6rem;
      letter-spacing: 0.1em;
      color: #778;
    }

    .key-hint kbd {
      background: #131320;
      border: 1px solid #2a2a4a;
      border-radius: 3px;
      padding: 2px 6px;
      font-family: 'Courier New', monospace;
      font-size: 0.6rem;
      color: #aab;
    }
  </style>
</head>
<body>

<h1>Drum Looper</h1>

<div class="matrix-wrapper">
  <div class="labels" id="labels"></div>
  <div class="grid-column">
    <div class="step-dots" id="step-dots"></div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<div class="controls">
  <button id="play-btn">Play</button>
  <button id="clear-btn">Clear</button>
  <button id="random-btn">Random</button>
  <button id="wav-btn">Export</button>
  <div class="bpm-control">
    <span>BPM</span>
    <input type="range" id="bpm-slider" min="60" max="200" value="120">
    <span id="bpm-val">120</span>
  </div>
  <div class="steps-control">
    <span>Steps</span>
    <select id="steps-select">
      <option value="8">8</option>
      <option value="16" selected>16</option>
      <option value="32">32</option>
    </select>
  </div>
</div>

<div class="key-guide">
  <span class="key-hint"><kbd>Space</kbd> play / stop</span>
  <span class="key-hint"><kbd>R</kbd> random</span>
  <span class="key-hint"><kbd>E</kbd> export wav</span>
  <span class="key-hint"><kbd>↑</kbd><kbd>↓</kbd> bpm ±5</span>
</div>

<script>
  const ROWS = 8;
  const MAX_COLS = 32;

  const TRACKS = [
    { name: 'Kick',     color: '#ff2244', glow: 'rgba(255,34,68,0.45)' },
    { name: 'Snare',    color: '#ff8c00', glow: 'rgba(255,140,0,0.45)' },
    { name: 'Hi-Hat',   color: '#ffe000', glow: 'rgba(255,224,0,0.45)' },
    { name: 'Open Hat', color: '#00ff88', glow: 'rgba(0,255,136,0.45)' },
    { name: '808',      color: '#00d4ff', glow: 'rgba(0,212,255,0.45)' },
    { name: 'Clap',     color: '#4488ff', glow: 'rgba(68,136,255,0.45)' },
    { name: 'Tom Hi',   color: '#cc44ff', glow: 'rgba(204,68,255,0.45)' },
    { name: 'Tom Lo',   color: '#ff44aa', glow: 'rgba(255,68,170,0.45)' },
  ];

  // State
  const gridState = Array.from({ length: ROWS }, () => Array(MAX_COLS).fill(false));
  let numCols = 16;
  let currentStep = -1;
  let isPlaying = false;
  let bpm = 120;
  let scheduleId = null;
  let audioCtx = null;
  let nextStepTime = 0;
  let schedulerTimer = null;

  function getCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  // ── Drum synthesis ──────────────────────────────────────────────

  function playKick(ctx, t) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.setValueAtTime(150, t);
    osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.5);
    g.gain.setValueAtTime(1.0, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
    osc.start(t); osc.stop(t + 0.5);
  }

  function playSnare(ctx, t) {
    const buf = ctx.createBuffer(1, ctx.sampleRate * 0.2, ctx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const noise = ctx.createBufferSource();
    noise.buffer = buf;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1000;
    const g = ctx.createGain();
    noise.connect(hp); hp.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.8, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
    noise.start(t); noise.stop(t + 0.2);

    const osc = ctx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = 100;
    const g2 = ctx.createGain();
    osc.connect(g2); g2.connect(ctx.destination);
    g2.gain.setValueAtTime(0.5, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
    osc.start(t); osc.stop(t + 0.1);
  }

  function playHiHat(ctx, t, open = false) {
    const decay = open ? 0.28 : 0.07;
    const ratios = [2, 3.15, 4.08, 5.05, 6.02, 8.21];
    const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 10000;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    const mg = ctx.createGain();
    bp.connect(hp); hp.connect(mg); mg.connect(ctx.destination);
    mg.gain.setValueAtTime(0.5, t); mg.gain.exponentialRampToValueAtTime(0.001, t + decay);
    ratios.forEach(r => {
      const o = ctx.createOscillator(); o.type = 'square'; o.frequency.value = 40 * r;
      o.connect(bp); o.start(t); o.stop(t + decay);
    });
  }

  function play808(ctx, t) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.setValueAtTime(55, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.8);
    g.gain.setValueAtTime(1.2, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.8);
    osc.start(t); osc.stop(t + 0.8);
  }

  function playClap(ctx, t) {
    for (let i = 0; i < 4; i++) {
      const offset = t + i * 0.012;
      const buf = ctx.createBuffer(1, ctx.sampleRate * 0.1, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let j = 0; j < d.length; j++) d[j] = Math.random() * 2 - 1;
      const noise = ctx.createBufferSource(); noise.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1200;
      const g = ctx.createGain();
      noise.connect(bp); bp.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.6, offset); g.gain.exponentialRampToValueAtTime(0.001, offset + 0.1);
      noise.start(offset); noise.stop(offset + 0.1);
    }
  }

  function playTom(ctx, t, freq, decay) {
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.connect(g); g.connect(ctx.destination);
    osc.frequency.setValueAtTime(freq, t);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.3, t + decay);
    g.gain.setValueAtTime(0.9, t); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
    osc.start(t); osc.stop(t + decay);
  }

  const PLAY_FNS = [
    playKick,
    playSnare,
    (ctx, t) => playHiHat(ctx, t, false),
    (ctx, t) => playHiHat(ctx, t, true),
    play808,
    playClap,
    (ctx, t) => playTom(ctx, t, 220, 0.25),
    (ctx, t) => playTom(ctx, t, 110, 0.35),
  ];

  // ── Precise scheduler ───────────────────────────────────────────
  // Schedule audio ~100ms ahead, update visuals with requestAnimationFrame

  const LOOKAHEAD_MS = 100;
  const SCHEDULE_INTERVAL_MS = 25;

  let pendingVisualStep = -1;

  function stepDuration() {
    return 60 / bpm / 4;
  }

  function scheduler() {
    const ctx = getCtx();
    while (nextStepTime < ctx.currentTime + LOOKAHEAD_MS / 1000) {
      const step = (currentStep + 1) % numCols;
      currentStep = step;
      pendingVisualStep = step;
      for (let row = 0; row < ROWS; row++) {
        if (gridState[row][step]) PLAY_FNS[row](ctx, nextStepTime);
      }
      nextStepTime += stepDuration();
    }
  }

  function startScheduler() {
    const ctx = getCtx();
    nextStepTime = ctx.currentTime;
    schedulerTimer = setInterval(scheduler, SCHEDULE_INTERVAL_MS);
    rafLoop();
  }

  function stopScheduler() {
    clearInterval(schedulerTimer);
    schedulerTimer = null;
  }

  let rafHandle = null;
  let lastVisualStep = -1;

  function rafLoop() {
    if (!isPlaying) return;
    if (pendingVisualStep !== lastVisualStep) {
      lastVisualStep = pendingVisualStep;
      updateVisuals(pendingVisualStep);
    }
    rafHandle = requestAnimationFrame(rafLoop);
  }

  // ── UI building ─────────────────────────────────────────────────

  const labelsEl = document.getElementById('labels');
  const stepDotsEl = document.getElementById('step-dots');
  const gridEl = document.getElementById('grid');
  const cells = []; // cells[row][col]

  function buildUI() {
    labelsEl.innerHTML = '';
    stepDotsEl.innerHTML = '';
    gridEl.innerHTML = '';
    gridEl.style.gridTemplateColumns = `repeat(${numCols}, 38px)`;
    cells.length = 0;

    TRACKS.forEach((track, row) => {
      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = track.name;
      label.style.color = track.color;
      labelsEl.appendChild(label);
    });

    for (let col = 0; col < numCols; col++) {
      const dot = document.createElement('div');
      dot.className = 'step-dot';
      stepDotsEl.appendChild(dot);
    }

    for (let row = 0; row < ROWS; row++) {
      cells[row] = [];
      for (let col = 0; col < numCols; col++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.row = row;
        cell.dataset.col = col;
        applyCellStyle(cell, row, col, false);
        cell.addEventListener('mousedown', onCellMouseDown);
        cell.addEventListener('mouseenter', onCellMouseEnter);
        gridEl.appendChild(cell);
        cells[row][col] = cell;
      }
    }
  }

  // drag-to-paint support
  let dragActive = false;
  let dragValue = false; // what we're painting (true=on, false=off)

  document.addEventListener('mouseup', () => { dragActive = false; });

  function onCellMouseDown(e) {
    e.preventDefault();
    const row = +this.dataset.row;
    const col = +this.dataset.col;
    dragValue = !gridState[row][col];
    dragActive = true;
    gridState[row][col] = dragValue;
    applyCellStyle(this, row, col, col === currentStep);
  }

  function onCellMouseEnter() {
    if (!dragActive) return;
    const row = +this.dataset.row;
    const col = +this.dataset.col;
    gridState[row][col] = dragValue;
    applyCellStyle(this, row, col, col === currentStep);
  }

  function applyCellStyle(cell, row, col, isHead) {
    const track = TRACKS[row];
    const on = gridState[row][col];

    if (on && isHead) {
      cell.style.background = track.color;
      cell.style.boxShadow = `0 0 10px 3px ${track.glow}, 0 0 22px 6px ${track.glow}`;
      cell.style.borderColor = 'transparent';
    } else if (on) {
      cell.style.background = track.color + 'aa';
      cell.style.boxShadow = `0 0 7px 2px ${track.glow}`;
      cell.style.borderColor = 'transparent';
    } else if (isHead) {
      cell.style.background = '#1a1a32';
      cell.style.boxShadow = 'none';
      cell.style.borderColor = '#2e2e56';
    } else {
      cell.style.background = '';
      cell.style.boxShadow = '';
      cell.style.borderColor = '';
    }
  }

  function updateVisuals(step) {
    const dots = stepDotsEl.children;
    for (let c = 0; c < numCols; c++) {
      dots[c].className = 'step-dot' + (c === step ? ' active' : '');
    }
    for (let row = 0; row < ROWS; row++) {
      for (let col = 0; col < numCols; col++) {
        if (cells[row] && cells[row][col]) {
          applyCellStyle(cells[row][col], row, col, col === step);
        }
      }
    }
  }

  // ── Randomizer ──────────────────────────────────────────────────

  function randomize() {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < MAX_COLS; c++)
        gridState[r][c] = false;

    const n = numCols;
    const maybe = (p) => Math.random() < p;
    const on = (row, col) => { const c = Math.round(col); if (c >= 0 && c < n) gridState[row][c] = true; };

    const q = n / 4;   // quarter note
    const e = n / 8;   // eighth note
    const s = n / 16;  // sixteenth note

    const b1 = 0, b2 = q, b3 = 2 * q, b4 = 3 * q;

    // Pick a groove style: 0=4-on-floor, 1=syncopated, 2=half-time
    const style = Math.floor(Math.random() * 3);

    // Kick
    if (style === 0) {
      on(0, b1); on(0, b2); on(0, b3); on(0, b4);
      if (maybe(0.3)) on(0, b4 + 3 * s);
      if (maybe(0.2)) on(0, b1 + 3 * s);
    } else if (style === 1) {
      on(0, b1); on(0, b3);
      if (maybe(0.6)) on(0, b1 + 3 * s);
      if (maybe(0.5)) on(0, b3 + 2 * s);
      if (maybe(0.35)) on(0, b4 + 3 * s);
      if (maybe(0.25)) on(0, b2 + 2 * s);
    } else {
      on(0, b1);
      if (maybe(0.65)) on(0, b2 + 2 * s);
      if (maybe(0.4)) on(0, b3 + s);
      if (maybe(0.3)) on(0, b4 + 3 * s);
    }

    // Snare
    if (style === 2) {
      on(1, b3);
      if (maybe(0.3)) on(1, b4);
      if (maybe(0.2)) on(1, b2);
    } else {
      on(1, b2); on(1, b4);
      if (maybe(0.25)) on(1, b1 + 2 * s);
      if (maybe(0.25)) on(1, b3 + 2 * s);
      if (maybe(0.15)) on(1, b4 + 3 * s);
    }

    // Hi-Hat
    const hatType = Math.floor(Math.random() * 3);
    if (hatType === 0) {
      for (let i = 0; i < 8; i++) on(2, i * e);
    } else if (hatType === 1) {
      for (let i = 0; i < 16; i++) {
        if (i % 4 === 3 && maybe(0.45)) continue;
        on(2, i * s);
      }
    } else {
      for (let i = 0; i < 8; i++) if (maybe(0.75)) on(2, i * e);
      for (let i = 0; i < 8; i++) if (maybe(0.3)) on(2, i * e + s);
    }

    // Open Hat (offbeat "ands", sparse)
    for (let i = 0; i < 4; i++) if (maybe(0.3)) on(3, i * q + 2 * s);
    // Mute open hat where closed hat is playing
    for (let c = 0; c < n; c++) if (gridState[2][c] && gridState[3][c]) gridState[3][c] = false;

    // 808
    if (maybe(0.55)) on(4, b1);
    if (maybe(0.4)) on(4, b3);
    if (maybe(0.3)) on(4, b2 + 2 * s);

    // Clap
    if (maybe(0.6)) { on(5, b2); on(5, b4); }
    else if (maybe(0.55)) on(5, b3);

    // Tom Hi (sparse fills)
    [b1 + 3*s, b2 + 2*s, b2 + 3*s, b3 + 3*s, b4 + 2*s, b4 + 3*s].forEach(t => {
      if (maybe(0.12)) on(6, t);
    });

    // Tom Lo (sparse fills)
    [b1 + 2*s, b2 + s, b3 + 3*s, b4 + 2*s, b4 + 3*s].forEach(t => {
      if (maybe(0.1)) on(7, t);
    });

    updateVisuals(isPlaying ? currentStep : -1);
  }

  // ── Controls ────────────────────────────────────────────────────

  const playBtn = document.getElementById('play-btn');
  const clearBtn = document.getElementById('clear-btn');
  const bpmSlider = document.getElementById('bpm-slider');
  const bpmVal = document.getElementById('bpm-val');
  const stepsSelect = document.getElementById('steps-select');

  playBtn.addEventListener('click', () => {
    getCtx(); // init on gesture
    if (isPlaying) {
      isPlaying = false;
      stopScheduler();
      cancelAnimationFrame(rafHandle);
      currentStep = -1;
      pendingVisualStep = -1;
      lastVisualStep = -1;
      updateVisuals(-1);
      playBtn.textContent = 'Play';
      playBtn.classList.remove('playing');
    } else {
      isPlaying = true;
      currentStep = -1;
      pendingVisualStep = -1;
      lastVisualStep = -1;
      startScheduler();
      playBtn.textContent = 'Stop';
      playBtn.classList.add('playing');
    }
  });

  document.addEventListener('keydown', (e) => {
    if (['INPUT', 'SELECT', 'TEXTAREA'].includes(e.target.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); playBtn.click(); }
    if (e.code === 'KeyR') { e.preventDefault(); randomize(); }
    if (e.code === 'KeyE') { e.preventDefault(); exportWAV(); }
    if (e.code === 'ArrowUp')   { e.preventDefault(); bpmSlider.value = bpm = Math.min(200, bpm + 5); bpmVal.textContent = bpm; }
    if (e.code === 'ArrowDown') { e.preventDefault(); bpmSlider.value = bpm = Math.max(60,  bpm - 5); bpmVal.textContent = bpm; }
  });

  document.getElementById('random-btn').addEventListener('click', randomize);

  // ── WAV Export ──────────────────────────────────────────────────

  function writeString(view, offset, str) {
    for (let i = 0; i < str.length; i++) view.setUint8(offset + i, str.charCodeAt(i));
  }

  function encodeWAV(buffer) {
    const numCh = buffer.numberOfChannels;
    const sr = buffer.sampleRate;
    const numSamples = buffer.length;
    const dataSize = numSamples * numCh * 2; // 16-bit
    const ab = new ArrayBuffer(44 + dataSize);
    const v = new DataView(ab);
    writeString(v, 0, 'RIFF');
    v.setUint32(4, 36 + dataSize, true);
    writeString(v, 8, 'WAVE');
    writeString(v, 12, 'fmt ');
    v.setUint32(16, 16, true);
    v.setUint16(20, 1, true); // PCM
    v.setUint16(22, numCh, true);
    v.setUint32(24, sr, true);
    v.setUint32(28, sr * numCh * 2, true);
    v.setUint16(32, numCh * 2, true);
    v.setUint16(34, 16, true);
    writeString(v, 36, 'data');
    v.setUint32(40, dataSize, true);
    let offset = 44;
    for (let i = 0; i < numSamples; i++) {
      for (let ch = 0; ch < numCh; ch++) {
        const s = Math.max(-1, Math.min(1, buffer.getChannelData(ch)[i]));
        v.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7fff, true);
        offset += 2;
      }
    }
    return ab;
  }

  async function exportWAV() {
    const hasAny = gridState.some(row => row.slice(0, numCols).some(Boolean));
    if (!hasAny) return;

    const wavBtn = document.getElementById('wav-btn');
    wavBtn.textContent = 'Rendering...';
    wavBtn.disabled = true;

    const sr = 44100;
    const patternDuration = numCols * stepDuration();
    const patternSamples = Math.ceil(sr * patternDuration);
    const offCtx = new OfflineAudioContext(2, patternSamples, sr);

    for (let col = 0; col < numCols; col++) {
      const t = col * stepDuration();
      for (let row = 0; row < ROWS; row++) {
        if (gridState[row][col]) PLAY_FNS[row](offCtx, t);
      }
    }

    const rendered = await offCtx.startRendering();
    const wav = encodeWAV(rendered);
    const blob = new Blob([wav], { type: 'audio/wav' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'drum-pattern.wav';
    a.click();
    URL.revokeObjectURL(url);

    wavBtn.textContent = 'Export';
    wavBtn.disabled = false;
  }

  document.getElementById('wav-btn').addEventListener('click', exportWAV);

  clearBtn.addEventListener('click', () => {
    for (let r = 0; r < ROWS; r++)
      for (let c = 0; c < MAX_COLS; c++)
        gridState[r][c] = false;
    updateVisuals(isPlaying ? currentStep : -1);
  });

  bpmSlider.addEventListener('input', () => {
    bpm = +bpmSlider.value;
    bpmVal.textContent = bpm;
  });

  stepsSelect.addEventListener('change', () => {
    const wasPlaying = isPlaying;
    if (wasPlaying) {
      isPlaying = false;
      stopScheduler();
      cancelAnimationFrame(rafHandle);
    }
    numCols = +stepsSelect.value;
    currentStep = -1;
    pendingVisualStep = -1;
    lastVisualStep = -1;
    buildUI();
    if (wasPlaying) {
      isPlaying = true;
      startScheduler();
    }
  });

  // ── Init ────────────────────────────────────────────────────────
  buildUI();
</script>
</body>
